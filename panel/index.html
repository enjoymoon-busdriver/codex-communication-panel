<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>传声筒</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--line:color-mix(in srgb,CanvasText 14%,transparent);--muted:color-mix(in srgb,CanvasText 65%,Canvas)}
*{box-sizing:border-box}body{background:Canvas;color:CanvasText;margin:0;padding:0}main{max-width:650px;margin:auto;padding:clamp(24px,6vh,66px) clamp(16px,4vw,36px) 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}header svg{width:34px;height:34px}h1{font-size:22px;line-height:1.25;margin:0;font-weight:650}
fieldset{min-width:0}form{border:1px solid var(--line);border-radius:14px;padding:4px 18px 14px;background:color-mix(in srgb,CanvasText 3%,Canvas)}
.row,#editor label{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
select,input:not([type=checkbox]){min-width:0;width:min(65%,245px);padding:6px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;color:inherit;background:Canvas}
input[type=checkbox]{appearance:none;position:relative;width:31px;height:18px;border-radius:12px;background:var(--muted);cursor:pointer}input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;background:white;border-radius:50%}input[type=checkbox]:checked{background:#25855d}input[type=checkbox]:checked::after{left:16px}
button{font:inherit;font-weight:550;padding:5px 14px;border:0;border-radius:8px;background:CanvasText;color:Canvas;cursor:pointer}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}#key,#status{color:var(--muted);font-size:13px}#status:empty{display:none}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:550}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}dt{font-weight:600;margin-top:7px}dd{margin:0}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 8px}
#reset{background:transparent;color:var(--muted);font-size:13px;font-weight:450;padding:4px}
#prompt{display:block;width:100%;min-height:6em;resize:vertical;padding:9px 11px;font:inherit;line-height:1.6;color:inherit;background:Canvas;border:1px solid var(--line);border-radius:7px}
@media(max-width:360px){select,input:not([type=checkbox]){width:58%}form{padding-inline:12px}}
</style>
<main><header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M17.6 24.6c2.8 8.4 3.5 13 7.5 12s3.1-8.6 5.3-13"/>
  <g transform="rotate(-38 12 17)">
    <path d="m5 12 2.6 12c.6 3 8.2 3 8.8 0L19 12"/>
    <ellipse cx="12" cy="12" rx="7" ry="2.7"/>
  </g>
  <g transform="rotate(38 36 16)">
    <path d="m29 11 2.6 12c.6 3 8.2 3 8.8 0L43 11"/>
    <ellipse cx="36" cy="11" rx="7" ry="2.7"/>
  </g>
</svg>
<h1>传声筒</h1></header><form id="settings"><fieldset id="controls" disabled style="border:0;margin:0;padding:0"><label class="row">使用沟通模型<input id="enabled" type="checkbox" role="switch"></label>
<fieldset id="editor" style="border:0;margin:0;padding:0"><label>服务商<select id="provider"><option value="go">OpenCode Go</option><option value="deepseek">DeepSeek</option><option value="custom">OpenAI 兼容服务</option></select></label>
<section data-id="go"><label>模型<select id="go"><option>glm-5.3</option><option>glm-5.3-flash</option><option>deepseek-v4.1-flash</option></select></label></section>
<section data-id="deepseek" hidden><label>模型<select id="deepseek"><option>deepseek-flash</option><option>deepseek-v4-pro</option></select></label></section>
<section data-id="custom" hidden><label>API 根地址<input id="url" type="url" placeholder="https://api.example.com/v1"></label><label>模型 ID<input id="custom" spellcheck="false"></label></section><label>API 密钥<input id="secret" type="password" autocomplete="new-password" placeholder="留空保留当前密钥"></label></fieldset>
<div class="prompt-head"><label for="prompt">沟通提示词</label><button type="button" id="reset">恢复默认</button></div>
<textarea id="prompt" rows="3" maxlength="32000"></textarea><div class="actions"><span id="key"></span><button>保存</button></div></fieldset></form>
<p id="status" role="status">正在读取设置…</p>
<details><summary>每次调用传入的内容</summary><dl><dt>question · 问题</dt><dd>原问题中与本次沟通有关的部分。</dd>
<dt>facts · 事实</dt><dd>需要传达的已核实事实列表。</dd><dt>uncertainties · 不确定项</dt><dd>尚未核实的信息、适用条件及待确认事项。</dd></dl></details></main>
<script type="module">/* BUNDLE */</script></html>
